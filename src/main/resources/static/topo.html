<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #313131;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            overflow: hidden;
        }
        header {
            padding: 15px 20px;
        }
        .logo {
            display: inline-block;
            font-size: 1.2rem;
            font-weight: bold;
            line-height: 35px;
        }
        .img-logo {
            height: 35px;
            width: auto;
            vertical-align: middle;
            margin-right: 8px;
        }
        .coral {
            color: #e85d75;
        }
    </style>
</head>
<body>
    <header>
        <p class="logo">
            <img src="images/perso.png" alt="Logo" class="img-logo">
            THE<span class="coral">CIENTISTAS</span>.COM
        </p>
    </header>
</body>
</html>
